name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'cctv-tauri-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller opencv-python-headless

      - name: Build local video engine
        run: |
          set -o pipefail
          (python -m PyInstaller --noconfirm --clean --onefile --name cctv-server \
            --distpath dist-sidecar \
            --workpath build-sidecar \
            --specpath build-sidecar \
            sidecar/cctv_server.py 2>&1) | tee sidecar-build.log
          mkdir -p src-tauri/binaries
          cp dist-sidecar/cctv-server.exe src-tauri/binaries/cctv-server-x86_64-pc-windows-msvc.exe
          ls -lh src-tauri/binaries/

      - name: Install desktop dependencies
        run: npm ci

      - name: Build Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          (npm run build -- --verbose --bundles nsis 2>&1) | tee tauri-build.log

      - name: Collect installer
        run: |
          mkdir -p release
          INSTALLER=$(find src-tauri/target/release/bundle/nsis -name '*.exe' -type f | head -n 1)
          if [ -z "$INSTALLER" ]; then
            echo "No NSIS installer was produced." >&2
            exit 1
          fi
          cp "$INSTALLER" release/CCTV-Viewer-Setup.exe
          SIGNATURE=$(find src-tauri/target/release/bundle/nsis -name '*.exe.sig' -type f | head -n 1)
          if [ -z "$SIGNATURE" ]; then
            echo "No updater signature was produced." >&2
            exit 1
          fi
          cp "$SIGNATURE" release/CCTV-Viewer-Setup.exe.sig
          (cd release && sha256sum CCTV-Viewer-Setup.exe > CCTV-Viewer-Setup.exe.sha256)
          VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          URL="https://github.com/supportinfraqr/CCTV-Viewer/releases/download/cctv-tauri-v${VERSION}/CCTV-Viewer-Setup.exe"
          SIGNATURE_TEXT=$(cat release/CCTV-Viewer-Setup.exe.sig)
          VERSION="$VERSION" URL="$URL" SIGNATURE_TEXT="$SIGNATURE_TEXT" python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          manifest = {
              "version": os.environ["VERSION"],
              "notes": "CCTV Viewer update",
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "windows-x86_64": {
                      "signature": os.environ["SIGNATURE_TEXT"],
                      "url": os.environ["URL"],
                  }
              },
          }
          with open("release/latest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2)
          PY
          ls -lh release
          cat release/latest.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCTV-Viewer-Windows
          path: |
            release/CCTV-Viewer-Setup.exe
            release/CCTV-Viewer-Setup.exe.sha256
            release/latest.json
            *-build.log
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/CCTV-Viewer-Setup.exe
            release/CCTV-Viewer-Setup.exe.sha256
            release/latest.json
          generate_release_notes: true
